name: Angular CI

on:
  push:
    branches: [ page-source ]
  pull_request:
    branches: [ page-source ]

jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4
    
    - name: Setting up NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Production build
      run: npx ng build --configuration production --base-href https://janlego.github.io/anglescina_Vadnica/
      
    - name: Providing 404 page
      run: cp docs/index.html docs/404.html
      
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/page-source' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: master
        publish_dir: docs/
